name: Diagnóstico
on:
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test 2>&1 | tail -30 | tee testes.log
        continue-on-error: true
      - name: Gerar em modo diagnóstico
        env:
          MODO: manual
        run: node --max-old-space-size=6144 src/gerar.js --diagnostico 2>&1 | tee diagnostico.log
      - name: Publicar diagnóstico
        if: always()
        run: |
          mkdir -p /tmp/diag && cp -r diagnostico.log testes.log saida-diagnostico /tmp/diag/ 2>/dev/null || true
          cd /tmp/diag
          git init -q -b diagnostico
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "diagnóstico ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" diagnostico
